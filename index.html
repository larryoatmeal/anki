<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Anki</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f9,#14161a);--card:light-dark(#fff,#1e2127);--ink:light-dark(#15171a,#eef0f3);--mute:light-dark(#5b6270,#9aa3b2);--acc:#2f7de1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,sans-serif;padding:32px 16px}
.wrap{max-width:440px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:24px 20px;box-shadow:0 6px 24px rgba(0,0,0,.08);font-size:22px;text-align:center}
a.btn{display:block;text-align:center;min-height:52px;line-height:52px;border-radius:14px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">No card in this link.</div>
  <a class="btn" id="go" href="#">Add to Anki</a>
</div>
<script>
const p = new URLSearchParams(location.search);
if (!p.has('type')) p.set('type', 'Basic');
if (!p.has('deck')) p.set('deck', 'Default');
if (p.has('fldFront')) {
  document.getElementById('card').innerText =
    p.get('fldFront') + '\n' + (p.get('fldBack') || '').replace(/<br>/g, '\n');
}
const url = 'anki://x-callback-url/addnote?' + p.toString();
document.getElementById('go').href = url;
if (p.has('fldFront')) setTimeout(() => { location.href = url; }, 300);
</script>
</body>
</html>
